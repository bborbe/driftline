name: CI

# Runs the fast test tier on every PR and every master merge commit, off the deploy path: pages.yml
# does not test, so a merge reaches the live site in about a minute. The slow tier runs in release.yml
# (v* tags) and nightly.yml (master) — docs/development.md § Test tiers.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test (fast tier)
        run: npm test
      - name: Build
        run: npm run build

  # The leaderboard server (server/, its own Go module): runs its Go tests.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        run: make test
