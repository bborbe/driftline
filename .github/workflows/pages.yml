name: Deploy to GitHub Pages

# One Pages site, one artifact: master builds into /, every open same-repo PR into /pr-<n>/.
# Each run rebuilds the whole set, so a closed PR drops out on the next deploy (that is the cleanup).
# pull_request_target runs this file from master in master's context, which the github-pages
# environment (master-only deploy policy) accepts. PR code is only ever built with contents: read;
# the deploy job runs no PR code. Fork PRs get no preview and do not trigger a deploy.

on:
  push:
    branches: [master]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions: {}

# One group, so two deploy-pages calls never overlap; cancel-in-progress false, so a running deploy is
# never cut. A queued run replaces an older queued one (a push run shows `cancelled` then), which is
# safe because every run builds root from master's live head (plan job), not from github.sha: the
# replacement deploys the newer master. Fork-PR runs, which deploy nothing, stay out of the group.
concurrency:
  group: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && format('pages-skip-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: List build targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          master=$(gh api "repos/$REPO/commits/master" --jq .sha)
          prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            | jq --arg repo "$REPO" '[.[] | select(.head.repo.full_name == $repo) | {n: .number, sha: .head.sha}]')
          targets=$(jq -c --arg master "$master" '
            [{name: "root", ref: $master, base: "/driftline/"}] +
            [.[] | {name: "pr-\(.n)", ref: .sha, base: "/driftline/pr-\(.n)/"}]' <<<"$prs")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets" | jq .
          echo "Root builds master \`$master\` (live head at plan time; covers any cancelled push run before it)." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A broken PR must never block or fail the production deploy.
    continue-on-error: ${{ matrix.target.name != 'root' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.ref }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # PR code never writes the shared npm cache.
          cache: ${{ matrix.target.name == 'root' && 'npm' || '' }}
      - name: Install
        # No lifecycle scripts for PR code: it runs with the Actions runtime token in master's cache scope.
        run: npm ci ${{ matrix.target.name != 'root' && '--ignore-scripts' || '' }}
      - name: Build
        # --base on the command line wins over the PR's vite.config.ts, also for branches cut before VITE_BASE existed.
        run: npx tsc && npx vite build --base "$VITE_BASE"
        env:
          VITE_COMMIT_SHA: ${{ matrix.target.ref }}
          VITE_BASE: ${{ matrix.target.base }}
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.target.name }}
          path: dist
          retention-days: 1

  deploy:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      deployed: ${{ steps.assemble.outputs.deployed }}
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: parts
      - name: Assemble site
        id: assemble
        run: |
          test -f parts/site-root/index.html || { echo "production build missing"; exit 1; }
          mv parts/site-root site
          deployed=""
          for d in parts/site-pr-*; do
            [ -d "$d" ] || continue
            n=${d#parts/site-pr-}
            mv "$d" "site/pr-$n"
            deployed="$deployed,$n"
          done
          echo "deployed=$deployed," >> "$GITHUB_OUTPUT"
          echo "previews:$deployed"
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment:
    # Upserts the preview comment on every PR this run deployed (or failed to build), not only the
    # triggering one: a queued run replaced by a newer one never reaches its own comment step.
    needs: [plan, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the preview comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          DEPLOYED: ${{ needs.deploy.outputs.deployed }}
          CLOSED_PR: ${{ github.event.action == 'closed' && github.event.pull_request.number || '' }}
        run: |
          marker='<!-- driftline-preview -->'
          upsert() { # <pr> <body>; never creates a comment for a closed PR
            local id old
            id=$(gh api "repos/$REPO/issues/$1/comments?per_page=100" --jq \
              "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
            if [ -n "$id" ]; then
              old=$(gh api "repos/$REPO/issues/comments/$id" --jq .body)
              [ "$old" = "$2" ] || gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$2" > /dev/null
            elif [ "$3" != closed ]; then
              gh api "repos/$REPO/issues/$1/comments" -f body="$2" > /dev/null
            fi
          }
          jq -r '.[] | select(.name != "root") | "\(.name | ltrimstr("pr-")) \(.ref)"' <<<"$TARGETS" |
          while read -r pr sha; do
            if [[ ",$DEPLOYED" == *",$pr,"* ]]; then
              body="$marker
          **Preview:** https://bborbe.github.io/driftline/pr-$pr/
          Commit: \`$sha\` (check \`<meta name=\"commit\">\`). Updates on every push, removed when the PR closes."
            else
              body="$marker
          Preview build failed for \`$sha\` — see the Deploy to GitHub Pages run. Production was deployed regardless."
            fi
            upsert "$pr" "$body" open < /dev/null
          done
          if [ -n "$CLOSED_PR" ]; then
            upsert "$CLOSED_PR" "$marker
          Preview removed (PR closed)." closed
          fi
