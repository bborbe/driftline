name: Release

# A v* tag is a release: run both test tiers (fast + slow), build, then create the GitHub release with
# the tag's CHANGELOG section as notes. The version comes from the tag: the github-releaser
# tags without bumping package.json, so the jobs stamp package.json from the tag (never pushed back).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set package.json version from tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Install
        run: npm ci
      - name: Test (fast + slow tiers)
        run: npm run test:all
      - name: Build
        run: npm run build

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v h="## $GITHUB_REF_NAME" '$0==h{on=1; next} /^## /{on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no '## $GITHUB_REF_NAME' section in CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
